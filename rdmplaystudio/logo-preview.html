<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RDM PlayStudio logo preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:52px;background:#07101c;color:#fff;font-family:Segoe UI,Arial,sans-serif}.preview{max-width:1080px;margin:auto}.label{margin:0 0 12px;color:#8da3bf;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.panel{display:grid;place-items:center;min-height:300px;margin-bottom:30px;padding:42px;border:1px solid #263a53;border-radius:24px}.dark{background:linear-gradient(145deg,#101d2d,#07101c)}.light{background:#eef3f9}.panel img{width:min(820px,100%)}.icon-row{display:flex;align-items:center;gap:25px}.icon-row img{width:150px}.icon-row strong{font-size:28px}.icon-row span{display:block;margin-top:5px;color:#8ea5c1;font-size:14px}@media(max-width:600px){body{padding:20px}.panel{min-height:220px;padding:24px}.icon-row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="preview">
    <p class="label">Primary logo · dark interface</p>
    <section class="panel dark"><img src="assets/rdm-playstudio-logo.svg" alt="RDM PlayStudio"></section>
    <p class="label">App icon</p>
    <section class="panel dark"><div class="icon-row"><img src="assets/rdm-playstudio-mark.svg" alt="RDM PlayStudio icon"><div><strong>RDM PlayStudio</strong><span>Your private media library. On every screen in your home.</span></div></div></section>
  </main>
</body>
</html>
